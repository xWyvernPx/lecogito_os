
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cogito OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
      /* --- Dynamic Theme Variables (Default: Bone) --- */
      :root {
        --os-bg: #e8e4d9;
        --os-window: #fdfdfd;
        --os-accent: #ff7e33;
        --os-accent-hover: #e0651e;
        --os-accent-border: #c2410c;
        --os-text: #121212;
        --os-border: #121212;
        --os-muted: #78716c;
      }

      body { margin: 0; overflow: hidden; background-color: var(--os-bg); color: var(--os-text); }
      
      /* --- Custom Retro Scrollbar --- */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background-color: var(--os-window); 
        border-left: 1px solid var(--os-border);
        border-top: 1px solid var(--os-border);
        /* Dotted pattern for retro feel */
        background-image: radial-gradient(var(--os-muted) 15%, transparent 16%);
        background-size: 3px 3px;
      }

      ::-webkit-scrollbar-thumb {
        background-color: var(--os-window);
        border: 1px solid var(--os-border);
        box-shadow: 1px 1px 0px 0px var(--os-border); /* Hard shadow */
        min-height: 30px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--os-accent); /* Accent */
      }

      ::-webkit-scrollbar-corner {
        background: var(--os-border);
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              os: {
                bg: 'var(--os-bg)',
                window: 'var(--os-window)',
                accent: 'var(--os-accent)',
                accentHover: 'var(--os-accent-hover)',
                accentBorder: 'var(--os-accent-border)',
                text: 'var(--os-text)',
                border: 'var(--os-border)',
                muted: 'var(--os-muted)',
              }
            },
            fontFamily: {
              mono: ['"Courier Prime"', 'monospace'],
              sans: ['"Inter"', 'sans-serif'],
            },
            boxShadow: {
              'retro-sm': '2px 2px 0 0 var(--os-border)',
              'retro-md': '4px 4px 0 0 var(--os-border)',
              'retro-lg': '6px 6px 0 0 var(--os-border)',
            }
          }
        }
      }
    </script>
